name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Report what would change without opening pull requests
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

permissions:
  contents: read

# Two Renovate runs against one repository would fight over the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # RENOVATE_TOKEN rather than GITHUB_TOKEN: pull requests opened with the
      # workflow token do not trigger CI, and automerge waits on those checks.
      - uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
