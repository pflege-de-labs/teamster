name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

  # An out-of-date generated file is invisible in review and, for anything but
  # templ, invisible to the compiler too: the build succeeds and the old code
  # runs. Regenerating and diffing is the only thing that catches it.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: make generate
      - name: Fail when the committed output is not what the generators produce
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    # The Postgres backend's tests skip when they are told of no server, and a
    # skip here would mean a whole backend going untested without saying so.
    # The suite fails rather than skips when CI is set and the DSN is not.
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: teamster
          POSTGRES_PASSWORD: teamster
          POSTGRES_DB: teamster
        options: >-
          --health-cmd "pg_isready -U teamster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEAMSTER_TEST_POSTGRES_DSN: postgres://teamster:teamster@127.0.0.1:5432/teamster?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # helm ships on the runner image, so there is no action to pin here.
      - name: Lint the chart
        run: helm lint charts/teamster --values charts/teamster/ci/statefulset-values.yaml

      # Both deployment shapes are rendered: the templates they share are the
      # ones a bad edit breaks silently in only one of them.
      - name: Render every deployment shape
        run: |
          for values in charts/teamster/ci/*-values.yaml; do
            echo "::group::$values"
            helm template teamster charts/teamster --values "$values"
            echo "::endgroup::"
          done

      # Rendering proves the chart is not broken; it says nothing about a chart
      # that is quietly wrong. This asserts what comes out.
      - name: Assert what the chart renders
        run: scripts/check-chart-render.sh charts/teamster

      # The chart refuses what the application cannot do; a rendering run that
      # succeeds here means the guard is gone.
      # Each of these is a deployment that would start and then be wrong, which
      # is why the chart refuses it at render time rather than at three in the
      # morning.
      - name: Reject the unsupported combinations
        run: |
          reject() {
            if helm template teamster charts/teamster "$@" >/dev/null 2>&1; then
              echo "chart accepted: $*" >&2
              exit 1
            fi
          }
          sqlite="--values charts/teamster/ci/statefulset-values.yaml"
          postgres="--values charts/teamster/ci/postgres-values.yaml"

          # SQLite takes one writer, and a Deployment needs a claim that outlives the pod.
          reject $sqlite --set replicaCount=2
          reject $sqlite --set workload.kind=Deployment
          # A driver nothing implements.
          reject $sqlite --set database.driver=cassandra
          # Postgres without somewhere to connect, or without a password.
          reject --set database.driver=postgres --set credentials.webhookToken=t \
            --set credentials.adminPassword=p --set credentials.graphClientSecret=s
          reject --set database.driver=postgres --set database.postgres.host=db \
            --set credentials.webhookToken=t --set credentials.adminPassword=p \
            --set credentials.graphClientSecret=s
          # Two passwords, which is one too many to reason about.
          reject $postgres --set database.postgres.passwordFrom.secretName=other
          # A claim a postgres release has no use for.
          reject $postgres --set persistence.existingClaim=data-teamster-0
          # A secret in the config file, where it would beat the environment
          # variable that carries it.
          reject $postgres --set config.settings.database.postgres.password=leaked
          reject $sqlite --set config.settings.webhook.token=leaked

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull requests from forks get no registry credentials, so they build only.
      - name: Decide whether the image can be pushed
        id: push
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request the checked-out HEAD is the merge commit, so the tag has
      # to come from the head commit to stay meaningful to whoever opened the PR.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          # :latest belongs to releases only, see ADR 0005.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.commit.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          build-args: |
            VERSION=${{ steps.commit.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skipped for pull_request builds entirely, not just forks: SecObserve
      # auto-creates a "branch" per so_branch_name on first import, and a
      # transient PR branch has no reason to leave a permanent-ish trace in a
      # findings tool. This repository's CI only otherwise runs on push to
      # main, so what remains is exactly the branch worth tracking over time.
      #
      # Scans the exact digest that was just pushed, not a tag that could be
      # repointed under it before the scan runs.
      - name: Scan the image with Trivy and upload results to SecObserve
        if: github.event_name != 'pull_request'
        uses: SecObserve/secobserve_actions_templates/actions/SCA/trivy_image@0a0f7d0981982a589f2a11c3f05c8e1c628fbd79 # v2026_08
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          target: ${{ env.IMAGE }}@${{ env.DIGEST }}
          report_name: trivy-image-report.cdx.json
          so_api_base_url: https://webhooks.p4e.io/secobserve
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: teamster
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: teamster
          so_origin_docker_image_name_tag: ${{ env.IMAGE }}:${{ steps.commit.outputs.short_sha }}
