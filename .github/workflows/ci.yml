name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Shared steps come from pflege-de-labs/github-workflows (ADR 0090); what only teamster needs stays here.
jobs:
  # Build, vet, gofmt, tidiness, generated-output drift, golangci-lint and govulncheck. The tests
  # need Postgres and NATS, which a called workflow cannot start, so they run in `test` below and
  # the shared job only compiles them.
  checks:
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      go-version: stable
      test-command: go test -run '^$' ./...
      generate-command: make generate
      golangci-lint-version: v2.14.0
      # 42 findings on first run; enabled once they are triaged.
      gosec-version: ""

  # The ruleset requires a check named lint; a called workflow reports as "checks / ...".
  lint:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the shared checks to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  # Renovate can move the version in manifest.json but cannot download the
  # library or compute its checksum, so a version-only bump leaves the
  # committed file and the recorded sum agreeing with each other and
  # vendor_test.go passing. Re-downloading at the pinned version here is the
  # only thing that notices a half-done bump before it ships.
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: make vendor
      # make vendor already fails on a checksum mismatch. This catches the
      # other half: a committed file that had drifted and was just repaired,
      # and a manifest entry whose library was never committed at all --
      # which a bare `git diff` would not see, because it is untracked.
      - name: Fail when the committed libraries were not already correct
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  test:
    runs-on: ubuntu-latest
    # The Postgres backend's tests skip when they are told of no server, and a
    # skip here would mean a whole backend going untested without saying so.
    # The suite fails rather than skips when CI is set and the DSN is not.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: teamster
          POSTGRES_PASSWORD: teamster
          POSTGRES_DB: teamster
        options: >-
          --health-cmd "pg_isready -U teamster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEAMSTER_TEST_POSTGRES_DSN: postgres://teamster:teamster@127.0.0.1:5432/teamster?sslmode=disable
      TEAMSTER_TEST_NATS_URL: nats://127.0.0.1:4222
      # A step rather than a service: JetStream needs the -js flag, which services cannot pass.
      NATS_IMAGE: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 "$NATS_IMAGE" -js
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  chart:
    uses: pflege-de-labs/github-workflows/.github/workflows/helm-lint.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      chart: charts/teamster
      # Both deployment shapes render; then assert what comes out and that every unsupported combination is refused.
      assert-command: scripts/check-chart-render.sh charts/teamster && scripts/check-chart-rejects.sh charts/teamster

  # Branch protection requires image, so waiting on checks makes stale generated code block a
  # merge, and keeps it out of the main image.
  build:
    needs: checks
    uses: pflege-de-labs/github-workflows/.github/workflows/image-build.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      # What the binary reports, e.g. v0.10.0-3-gabc1234: the last release and how far past it.
      version: describe

  # The ruleset requires a check named image; a called workflow reports as "build / Image".
  image:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the image build to have passed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  # Skipped for pull requests: SecObserve creates a branch per so_branch_name, and a transient PR
  # branch has no reason to leave a trace there. It reports and never fails the run.
  secobserve:
    needs: build
    if: github.event_name != 'pull_request'
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      tag: ${{ needs.build.outputs.short-sha }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
