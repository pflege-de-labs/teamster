name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Shared steps come from pflege-de-labs/github-workflows (ADR 0090); what only teamster needs stays here.
jobs:
  # A release is cut from main. A tag elsewhere would publish code that never went through a pull request.
  guard:
    uses: pflege-de-labs/github-workflows/.github/workflows/release-guard.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0

  # The release rebuilds its artifacts, so the tagged commit is gated here rather than relying on
  # the CI run of whatever was pushed to main. The build compiles the committed templ, sqlc and
  # Tailwind output, so a tag must not ship output its sources no longer produce.
  verify:
    needs: guard
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      go-version: stable
      test-command: go test -run '^$' ./...
      generate-command: make generate
      golangci-lint-version: v2.14.0
      gosec-version: ""

  test:
    needs: guard
    runs-on: ubuntu-latest
    # Mirrors ci.yml's test job, which the shared checks cannot run: they start no services, and the
    # Postgres conformance suite fails rather than skips when the DSN is unset.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: teamster
          POSTGRES_PASSWORD: teamster
          POSTGRES_DB: teamster
        options: >-
          --health-cmd "pg_isready -U teamster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEAMSTER_TEST_POSTGRES_DSN: postgres://teamster:teamster@127.0.0.1:5432/teamster?sslmode=disable
      TEAMSTER_TEST_NATS_URL: nats://127.0.0.1:4222
      # A step rather than a service: JetStream needs the -js flag, which services cannot pass.
      NATS_IMAGE: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 "$NATS_IMAGE" -js
      - run: make coverage

  image:
    needs: [verify, test]
    uses: pflege-de-labs/github-workflows/.github/workflows/image-release.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      # -X silently no-ops on a wrong symbol path; this catches an image reporting "dev".
      version-check: true

  # Each release is tracked in SecObserve as its own branch, so a finding is attributed to the
  # release it shipped in. It reports and never fails the release.
  secobserve:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ github.ref_name }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}

  # A minor's documentation is frozen from the pages branch once its release is out (ADR 0080).
  docs:
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create and deploy the docs branch for this minor
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a pre-release; its docs stay on pages"
            exit 0
          fi
          minor=${TAG%.*}
          branch=pages-$minor
          if gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then
            echo "$branch exists"
            exit 0
          fi
          newest=$(git ls-remote --tags --refs "https://github.com/$REPO" 'v*' |
            sed -n 's#.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*$#\1#p' | sort -uV | tail -1)
          if [[ $minor != "$newest" ]]; then
            echo "::warning::$branch is missing, but $newest is newer; create it by hand from the right commit"
            exit 0
          fi
          sha=$(gh api "repos/$REPO/git/ref/heads/pages" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" --silent
          # A push by GITHUB_TOKEN starts no workflow, so the deploy is dispatched instead.
          gh workflow run docs-deploy.yml --repo "$REPO" --ref "$branch"
          echo "Created $branch from pages@${sha::7} and dispatched docs-deploy"

  binaries:
    needs: [verify, test]
    uses: pflege-de-labs/github-workflows/.github/workflows/go-binaries.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: write
      id-token: write
    with:
      name: teamster
      package: ./cmd/teamster
      go-version: stable
