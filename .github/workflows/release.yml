name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The release rebuilds its artifacts, so the tagged commit is gated here
  # rather than relying on the CI run of whatever was pushed to main.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2
      - run: make coverage

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Re-releasing an older tag or cutting a pre-release must not move
      # :latest, so it only follows the highest stable tag in the repository.
      - name: Decide whether this release owns :latest
        id: latest
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "$GITHUB_REF_NAME is a pre-release, leaving :latest alone"
              echo "owns=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          newest=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is the newest stable tag, it owns :latest"
            echo "owns=true" >> "$GITHUB_OUTPUT"
          else
            echo "$newest is newer than $GITHUB_REF_NAME, leaving :latest alone"
            echo "owns=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ steps.latest.outputs.owns }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One build feeds every release tag, so they all resolve to this digest.
      # SBOM and provenance ride along as attestations on the same index.
      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token, so there
      # is no private key to hold. Signing by digest covers every tag at once.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Verify the signature and the attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          # buildx attaches SBOM and provenance as in-toto attestations on the
          # index, so they are asserted here rather than through cosign.
          for kind in SBOM Provenance; do
            if ! docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json .${kind} }}" | grep -q .; then
              echo "::error::the image carries no ${kind} attestation"
              exit 1
            fi
            echo "${kind} attestation present"
          done
          {
            echo "### Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
          } >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/teamster-${target%/*}-${target#*/}" ./cmd/teamster
          done

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate an SBOM per binary
        run: |
          for binary in dist/teamster-*; do
            syft scan "file:${binary}" -o spdx-json > "${binary}.spdx.json"
          done

      # Checksums cover the binaries and their SBOMs, so signing this one file
      # is enough to authenticate every release asset.
      - name: Checksum the assets
        run: (cd dist && sha256sum teamster-* > checksums.txt)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A bundle carries the signature and the certificate in one file, and is
      # what cosign v3 requires of sign-blob. cosign v2 writes it too.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: dist/*
