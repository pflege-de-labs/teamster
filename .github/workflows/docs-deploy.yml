name: docs-deploy

on:
  push:
    branches:
      - pages
      - pages-v*
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  SITE: https://pflege-de-labs.github.io
  DOCS_ROOT: /teamster/

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # enableGitInfo reads each page's last commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
      - name: Derive the version directory
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            pages) dir=dev ;;
            pages-v*) dir=${BRANCH#pages-} ;;
            *) echo "::error::$BRANCH is not a docs branch"; exit 1 ;;
          esac
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
      - name: Build
        env:
          HUGO_PARAMS_DOCVERSION: ${{ steps.version.outputs.dir }}
          HUGO_PARAMS_DOCSROOT: ${{ env.DOCS_ROOT }}
          HUGO_PARAMS_EDITURL_BASE: https://github.com/${{ github.repository }}/edit/${{ github.ref_name }}/content
        run: hugo --gc --minify --panicOnWarning --baseURL "$SITE$DOCS_ROOT${{ steps.version.outputs.dir }}/"
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: public
          target-folder: ${{ steps.version.outputs.dir }}
          clean: true
          commit-message: "docs: publish ${{ steps.version.outputs.dir }} from ${{ github.sha }}"
      - name: Write the version list and root redirect
        run: |
          scripts/versions.sh root
          touch root/.nojekyll
      # Only adds root files; clean would delete every version directory.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: root
          clean: false
          commit-message: "docs: update the version list"
