# The deploy workflow overrides baseURL and params.docVersion per build.
baseURL: https://pflege-de-labs.github.io/teamster/dev/
title: Teamster
defaultContentLanguage: en
# English stays at the version root, so links published before German existed keep working.
defaultContentLanguageInSubdir: false
languages:
  en:
    label: English
    locale: en-US
    weight: 1
  de:
    label: Deutsch
    locale: de-DE
    weight: 2
    params:
      description: Leitet Webhooks von Prometheus Alertmanager und anderen Absendern an Microsoft Teams weiter.
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    # Hextra translates a menu name through i18n/<lang>.yaml, keyed by its identifier.
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    # Children are replaced at runtime from versions.json, see assets/js/versions.js.
    - identifier: versions
      name: Versions
      weight: 2
    - identifier: versions-all
      name: All versions
      url: https://pflege-de-labs.github.io/teamster/
      parent: versions
    - name: Search
      weight: 4
      params:
        type: search
    - name: Language
      weight: 3
      params:
        type: language-switch
    - name: GitHub
      weight: 5
      url: https://github.com/pflege-de-labs/teamster
      params:
        icon: github

params:
  # dev for the pages branch, vX.Y for pages-vX.Y, pr-N for previews.
  docVersion: dev
  # Path under which versions.json and every version directory live.
  docsRoot: /teamster/
  description: Route Prometheus Alertmanager and generic webhooks to Microsoft Teams.
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.png
      width: 28
      height: 28
  page:
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: https://github.com/pflege-de-labs/teamster/edit/pages/content
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
