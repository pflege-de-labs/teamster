server:
  addr: ":8080"
  shutdown-timeout: "15s"
  # A slow client holds a connection until one of these expires.
  read-timeout: "15s"
  # Must exceed graph.timeout-sec below, or a handler waiting on Microsoft
  # Graph is cut off before Graph itself gives up.
  write-timeout: "60s"
  idle-timeout: "120s"
  # Where people reach the admin UI. A message sent without a template links
  # here so that someone can create one. Leave it empty and the message still
  # says a template is missing, but has no link.
  external-url: ""

database:
  # Where the state lives.
  #   sqlite   - one file, no other runtime dependency, and exactly one
  #              instance: SQLite takes a single writer. The default.
  #   postgres - several instances sharing one database.
  driver: "sqlite"

  # sqlite only.
  path: "teamster.db"

  # postgres only. The settings of the driver that is not selected are ignored,
  # so both blocks can stay here while an installation moves between them.
  postgres:
    host: ""
    port: 5432
    dbname: "teamster"
    user: "teamster"
    # Leave this commented out. A config file value wins over an environment
    # variable, so a password here would silently override the
    # TEAMSTER_DATABASE_POSTGRES_PASSWORD your secret store provides.
    # password: ""
    sslmode: "require"
    # verify-ca and verify-full check the server against this. A managed
    # Postgres publishes its own root, which the container image does not carry.
    sslrootcert: ""
    # Instead of the fields above, for what they cannot say -- a pooler, a
    # target_session_attrs. Carries the password, so set it from the
    # environment rather than here.
    url: ""

  # 0 lets the backend choose: unbounded for SQLite, which serialises on one
  # connection anyway, and 10 open with 5 idle for Postgres. Divide a server's
  # max_connections by the number of instances before raising it.
  max-open-conns: 0
  max-idle-conns: 0
  conn-max-lifetime: "0s"
  connect-timeout: "10s"
  # What opening the database does about a schema that is not the one this
  # build expects:
  #   auto   — apply what is missing. The default, and what every release
  #            before there was a version ledger did implicitly.
  #   verify — refuse to start, naming `teamster migrate up`. For a deployment
  #            that would rather a schema change were a step somebody watches,
  #            or whose database role may not change the schema.
  #   off    — open it as it is and ask no questions.
  migrate: "auto"

webhook:
  token: "replace-with-shared-token"

# The admin UI's text. Roles, dates and the alert payloads are unaffected; this
# is only what the pages say.
ui:
  # Used when a browser's Accept-Language names nothing this build carries.
  language: "en"
  # Optional: JSON files named after a language (de.json) whose entries override
  # the built-in text, so wording can be changed without waiting for a release.
  locale-dir: ""

# What the service says about itself. Off by default: the attributes name
# routes, templates and channels, and the listener authenticates nobody — keep
# it on an interface only your collector can reach.
metrics:
  enabled: false
  addr: "127.0.0.1:9090"
  path: "/metrics"
  # Serves the Prometheus exporter, which emits native histograms. Prometheus
  # must be started with --enable-feature=native-histograms to negotiate the
  # protobuf exposition; without it the scrape silently degrades to a count and
  # a sum, and every quantile becomes NaN.
  prometheus: true
  # Leave empty to run no OTLP exporter. host:port for grpc, a URL for http.
  otlp-endpoint: ""
  otlp-protocol: "http"
  otlp-insecure: false
  otlp-interval: "60s"
  shutdown-timeout: "5s"
  service-name: "teamster"

# The local login, used at /admin/login and as basic auth for /api. Keep it
# configured: it is the way back in if the identity provider is unreachable or
# the claim below is wrong.
admin:
  username: "admin"
  password: "change-me"

# Who may administer the service. Unrelated to the graph section below, which is
# a machine credential for posting cards.
auth:
  # Leave oidc-discovery-url empty to use the local login only.
  oidc-discovery-url: "https://login.example/auth/realms/internal/.well-known/openid-configuration"
  oidc-client-id: "teamster"
  # Omit for a public client using PKCE, which is the recommended setup.
  oidc-client-secret: ""
  oidc-redirect-url: "https://teamster.example/admin/auth/callback"
  oidc-scopes: ["profile", "email", "roles"]
  # Keycloak nests roles: realm roles live here, client roles under
  # resource_access.<client>.roles. The claim is read from the id token, then
  # userinfo, then the access token, so Keycloak's default mappers suffice.
  claim: "realm_access.roles"
  # Roles are read from that claim by name, one to one: a provider role called
  # admin, editor or viewer is that role here, and one called anything else
  # arrives under its own name for the Cedar policies to decide about. Those
  # three are required; the shipped policies define them.
  #
  # default-role is what someone gets when the claim names none of them. Leave
  # it empty and they sign in with no access at all, and are told to ask an
  # administrator for a role.
  default-role: "viewer"
  session-ttl: "12h"
  # Delegated Teams/Channels (ADR 0037): lets the Destinations picker offer an
  # admin their own Teams alongside the tenant-wide list, using the Entra
  # token Keycloak already stored when it brokered this login against Entra.
  # Off by default, and only meaningful when Keycloak federates against
  # Entra -- see docs/keycloak.md#delegated-teams-and-channels.
  broker:
    enabled: false
    idp-alias: "microsoft"
    # 32 random bytes, base64 -- e.g. `openssl rand -base64 32`.
    token-encryption-key: ""

# The Bot Framework identity used to send an alert to a person's chat, a
# second and separate Entra registration from graph below: revoking or
# rotating one never touches the other, and a deployment that does not want
# alerts in someone's chat sets none of this.
#
# Leave tenant-id, client-id and client-secret all empty to turn the whole
# feature off. Setting any one of the three without the other two is a
# configuration error caught at startup.
bot:
  # Not required when tenant-type is multi: that registration authenticates
  # through the shared botframework.com tenant rather than its own.
  tenant-id: ""
  client-id: ""
  client-secret: ""
  # single - the bot's Entra registration accepts sign-in from this tenant
  #          only. What most deployments want.
  # multi  - the registration accepts any tenant's users, authenticated by
  #          Bot Framework through a shared botframework.com endpoint rather
  #          than this tenant's own.
  tenant-type: "single"
  # Empty derives a token endpoint from tenant-id and tenant-type above. A
  # sovereign cloud changes this, metadata-url and scope together.
  token-url: ""
  scope: "https://api.botframework.com/.default"
  # Where inbound Bot Framework requests are validated against; unused until
  # the inbound endpoint ships.
  metadata-url: "https://login.botframework.com/v1/.well-known/openidconfiguration"
  timeout-sec: 10

graph:
  tenant-id: "your-tenant-id"
  client-id: "your-client-id"
  client-secret: "your-client-secret"
  base-url: "https://graph.microsoft.com/v1.0"
  # Empty derives https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token.
  # A sovereign cloud changes this, base-url and scope together; so does a test
  # that wants Graph to be something it controls.
  token-url: ""
  scope: "https://graph.microsoft.com/.default"
  timeout-sec: 10
