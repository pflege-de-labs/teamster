{{- /*
The config file is a Secret rather than a ConfigMap: it is the operator's own
YAML, and anything teamster reads from a file — an OIDC client secret among
them — would otherwise sit in plain sight in a ConfigMap.
*/ -}}
{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teamster.configSecretName" . }}
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "teamster.configYaml" . | nindent 4 }}
{{- end }}
