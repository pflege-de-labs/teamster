{{- include "teamster.validate" . -}}
{{- $fullName := include "teamster.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $ext := .Values.httpRoute.external -}}
{{- $int := .Values.httpRoute.internal -}}
{{- if $ext.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-external
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
  {{- with $ext.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $ext.parentRefs | nindent 4 }}
  {{- with $ext.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml $ext.matches | nindent 8 }}
      {{- with $ext.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ext.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
    {{- if not $int.enabled }}
    # httpRoute.internal is off: its own traffic is served here instead, so this
    # route alone still reaches everything the way the chart's single-HTTPRoute
    # mode always has.
    - matches:
        {{- toYaml $int.matches | nindent 8 }}
      {{- with $int.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $int.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
{{- if $int.enabled }}
{{- if $ext.enabled }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-internal
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
  {{- with $int.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $int.parentRefs | nindent 4 }}
  {{- with $int.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml $int.matches | nindent 8 }}
      {{- with $int.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $int.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
{{- end }}
