{{- /*
Credentials travel as environment variables, not in the config file: teamster
reads an environment variable only when no config file sets that key, so these
must stay out of the rendered config.yaml.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teamster.credentialsSecretName" . }}
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
type: Opaque
stringData:
  TEAMSTER_WEBHOOK_TOKEN: {{ required "credentials.webhookToken is required unless credentials.existingSecret is set" .Values.credentials.webhookToken | quote }}
  TEAMSTER_ADMIN_USERNAME: {{ required "credentials.adminUsername is required unless credentials.existingSecret is set" .Values.credentials.adminUsername | quote }}
  TEAMSTER_ADMIN_PASSWORD: {{ required "credentials.adminPassword is required unless credentials.existingSecret is set" .Values.credentials.adminPassword | quote }}
  TEAMSTER_GRAPH_CLIENT_SECRET: {{ required "credentials.graphClientSecret is required unless credentials.existingSecret is set" .Values.credentials.graphClientSecret | quote }}
  {{- /* Omitted for a public client using PKCE, which is the recommended setup. */}}
  {{- with .Values.credentials.oidcClientSecret }}
  TEAMSTER_AUTH_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.credentials.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
