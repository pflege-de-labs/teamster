{{- /*
A budget only makes sense once there is more than one pod to keep. One out of
one is not availability, it is a node drain that never completes.
*/ -}}
{{- if and .Values.pdb.enabled (eq .Values.database.driver "postgres") (gt (int .Values.replicaCount) 1) }}
{{- if and .Values.pdb.minAvailable .Values.pdb.maxUnavailable }}
{{- fail "set either pdb.minAvailable or pdb.maxUnavailable, not both" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "teamster.fullname" . }}
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
spec:
  {{- with .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- else }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "teamster.selectorLabels" . | nindent 6 }}
{{- end }}
