{{- /*
Deployment mode has no volumeClaimTemplate, so the claim carrying the SQLite
file is a resource of its own. It is kept on uninstall by default: the alert
state and the admin configuration live in it.
*/ -}}
{{- if and (eq .Values.workload.kind "Deployment") .Values.persistence.enabled .Values.persistence.create (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "teamster.claimName" . }}
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
    {{- with .Values.persistence.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.persistence.keepOnUninstall }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
