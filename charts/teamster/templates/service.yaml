apiVersion: v1
kind: Service
metadata:
  name: {{ include "teamster.fullname" . }}
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "teamster.selectorLabels" . | nindent 4 }}
{{- if eq .Values.workload.kind "StatefulSet" }}
---
{{- /* A StatefulSet needs a governing headless service for its pod DNS. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teamster.fullname" . }}-headless
  labels:
    {{- include "teamster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "teamster.selectorLabels" . | nindent 4 }}
{{- end }}
