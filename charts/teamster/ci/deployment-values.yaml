# Deployment mode against a chart-managed claim, exposed through Gateway API,
# with extraObjects in its list form.
workload:
  kind: Deployment

persistence:
  create: true
  keepOnUninstall: false

credentials:
  webhookToken: ci-token
  adminUsername: admin
  adminPassword: ci-password
  graphClientSecret: ci-graph-secret
  botClientSecret: ci-bot-secret
  brokerTokenEncryptionKey: Y2ktYnJva2VyLWtleS0zMi1ieXRlcy1sb25nLS0tLS0=

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

config:
  settings:
    metrics:
      enabled: true
    graph:
      tenant-id: ci-tenant
      client-id: ci-client
    bot:
      tenant-id: ci-bot-tenant
      client-id: ci-bot-client
    auth:
      oidc-discovery-url: https://login.ci/realms/internal/.well-known/openid-configuration
      oidc-client-id: teamster
      oidc-redirect-url: https://teamster.ci/admin/auth/callback
      claim: realm_access.roles
      default-role: viewer
      broker:
        enabled: true
        idp-alias: microsoft

# internal is off: this is the fallback shape, where external alone reaches
# both the webhooks and the admin interface.
httpRoute:
  external:
    enabled: true
    hostnames:
      - teamster.ci

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ include \"teamster.fullname\" . }}-extra-list"
    data:
      release: "{{ .Release.Name }}"
