# Default values for teamster.
# This is a YAML-formatted file.

# SQLite takes a single writer, so a sqlite release is one pod and the chart
# refuses anything higher. With database.driver=postgres there is no such
# limit: raise this and the replicas share the database.
replicaCount: 1

image:
  repository: ghcr.io/pflege-de-labs/teamster
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# How the pod is managed.
#
#   StatefulSet — the default. The SQLite file lives on a volume the chart
#     requests through a volumeClaimTemplate, and it survives a rescheduled pod.
#   Deployment — for a cluster that manages its storage separately. Needs
#     persistence.existingClaim, or persistence.create=true. The update strategy
#     is Recreate either way, because a ReadWriteOnce volume admits one pod.
#
# There is no Deployment-with-a-remote-database mode: teamster stores its state
# in SQLite only. See charts/teamster/README.md.
workload:
  # Empty derives it from the driver: a StatefulSet for sqlite, whose file needs
  # a claim that follows the pod, and a Deployment for postgres, which keeps
  # nothing locally. Set it to override; the combinations that cannot work are
  # refused at render time.
  kind: ""
  annotations: {}
  # StatefulSet only.
  updateStrategy:
    type: RollingUpdate
  # Deployment only. Empty derives Recreate for sqlite, because a ReadWriteOnce
  # volume admits one pod, and a surging RollingUpdate for postgres.
  strategy: {}

# Which store teamster runs against.
#
#   sqlite   - one pod, state in a file on a volume. The default.
#   postgres - several pods sharing one database. This chart does NOT deploy a
#              Postgres; point it at one your cluster or your provider manages.
#              See the chart README, "Bring your own Postgres".
database:
  driver: sqlite

  sqlite:
    # File name below persistence.mountPath. The full path is written into the
    # rendered config as database.path.
    fileName: teamster.db

  postgres:
    host: ""
    port: 5432
    dbname: teamster
    user: teamster
    sslmode: require
    # Path inside the container. Mount the CA with volumes/volumeMounts: a
    # managed Postgres publishes its own root, which the image does not carry.
    sslrootcert: ""
    # Read the password from a secret somebody else owns -- the one a Postgres
    # operator or your cloud provider created. Mutually exclusive with
    # credentials.databasePassword.
    passwordFrom:
      secretName: ""
      key: password

  # 0 lets the backend choose. Divide the server's max_connections by
  # replicaCount before raising maxOpenConns.
  maxOpenConns: 0
  maxIdleConns: 0
  connMaxLifetime: ""

# The volume carrying the SQLite file. Ignored entirely under
# database.driver=postgres, where nothing is written outside /tmp.
#
# Turning this off runs on an emptyDir: every template, destination, route and
# active alert is lost when the pod restarts. Useful for a demo, nothing else.
persistence:
  enabled: true
  mountPath: /data
  # Use a claim you manage instead of one from this chart.
  existingClaim: ""
  # Deployment mode only: render a PersistentVolumeClaim. StatefulSet mode
  # always uses a volumeClaimTemplate.
  create: false
  # Deployment mode only: keep the claim when the release is uninstalled.
  keepOnUninstall: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}
  labels: {}
  # StatefulSet only, requires Kubernetes 1.27+.
  retentionPolicy: {}
    # whenDeleted: Retain
    # whenScaled: Retain

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid 65532 (distroless nonroot). fsGroup lets that user write
# to the mounted volume whatever the storage class hands out.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Must exceed config.settings.server.shutdown-timeout, or the drain is cut off
# by the kubelet before teamster finishes it.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8080
  # Only used when type is NodePort.
  nodePort: ""
  annotations: {}

# How the metrics listener is scraped. Everything here needs
# config.settings.metrics.enabled above; the port itself is published on the
# Service automatically whenever the listener exists.
metrics:
  serviceMonitor:
    # Requires the Prometheus operator's CRDs.
    enabled: false
    # Defaults to the release namespace.
    namespace: ""
    # Labels the operator's serviceMonitorSelector looks for.
    labels: {}
    annotations: {}
    # Empty uses the Prometheus global.
    interval: ""
    scrapeTimeout: ""
    # PrometheusProto FIRST is what gets native histograms out of this chart:
    # it is the only protocol that carries them. Prometheus still needs
    # --enable-feature=native-histograms, or it will not negotiate protobuf
    # whatever this says.
    scrapeProtocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
      - PrometheusText0.0.4
    honorLabels: false
    relabelings: []
    metricRelabelings: []

# The config file, mounted at /etc/xdg/teamster/config.yaml — the system-wide
# XDG location teamster searches on startup.
config:
  # Mount a Secret you manage instead. It must carry a config.yaml key.
  existingSecret: ""
  # Written verbatim into config.yaml, so the keys are teamster's own
  # hyphenated flag names (see config.example.yaml in the repository).
  #
  # database.path is owned by the chart: it has to agree with the volume mount.
  #
  # Do NOT put the webhook token, admin password, Graph client secret or OIDC
  # client secret here. They belong in `credentials` below, which reaches the
  # process as environment variables — and an environment variable is read only
  # when no config file sets that key, so a value here would win over the one
  # from the secret.
  settings:
    server:
      addr: ":8080"
      shutdown-timeout: 15s
      read-timeout: 15s
      # Must exceed graph.timeout-sec, or a handler waiting on Microsoft Graph
      # is cut off before Graph itself gives up.
      write-timeout: 60s
      idle-timeout: 120s
      # Where people reach the admin UI, e.g. https://teamster.example.com. A
      # message sent without a template links here so that someone can
      # create one.
      external-url: ""
    graph:
      tenant-id: ""
      client-id: ""
      base-url: https://graph.microsoft.com/v1.0
      timeout-sec: 10
    # Alerts in a person's chat, off by default. tenant-id (unless
    # tenant-type is multi), client-id and credentials.botClientSecret below
    # are required together, or leave this section empty for none of it.
    bot: {}
      # tenant-id: ""
      # client-id: ""
      # tenant-type: single       # single or multi
      # timeout-sec: 10
    # Who may administer the service. Leave oidc-discovery-url empty to use the
    # local login only.
    auth: {}
      # oidc-discovery-url: https://login.example/auth/realms/internal/.well-known/openid-configuration
      # oidc-client-id: teamster
      # oidc-redirect-url: https://teamster.example/admin/auth/callback
      # oidc-scopes: [profile, email, roles]
      # claim: realm_access.roles
      # Roles are read from that claim by name: a provider role called admin,
      # editor or viewer is that role here. default-role covers a user the
      # claim names none of them for; empty means no access.
      # default-role: viewer
      # session-ttl: 12h
      # Delegated Teams/Channels in the Destinations picker, off by default. It
      # needs Keycloak brokering the login against Entra, and
      # credentials.brokerTokenEncryptionKey below -- never the key itself here.
      # broker:
      #   enabled: true
      #   idp-alias: microsoft
    # Label keys, label values and annotation keys remembered from incoming
    # alerts, so the template and route editors can complete them. Annotation
    # values are never stored. On by default; the values shown are the defaults.
    # samples:
    #   enabled: true
    #   retention: 720h
    #   max-values-per-key: 50
    #   max-value-length: 200
    #   lru-size: 4096
    #   flush-interval: 5m
    # The admin UI's text. locale-dir points at catalog files that override the
    # built-in wording; mount them if you use it.
    ui:
      language: en

    # What teamster says about itself. Off by default, here as in the
    # application: the attributes name routes, templates and channels.
    #
    # Turning `enabled` on opens a SECOND listener, on `addr`, serving the
    # Prometheus exporter at `path`. It asks for no credentials, exactly like
    # the probes. The application defaults it to 127.0.0.1 for that reason; in
    # a pod that would put it out of reach of everything including the Service,
    # so the chart binds all interfaces and the chart REFUSES a loopback addr.
    # Keep it private with a NetworkPolicy instead — the pod network is the
    # boundary here, not the loopback interface.
    #
    # The exporter emits NATIVE histograms. Prometheus needs
    # `--enable-feature=native-histograms` to negotiate protobuf; without it the
    # scrape does not fail, it silently loses every bucket. See the chart README.
    metrics:
      enabled: false

      # SCRAPED: the Prometheus exporter on a listener of its own. The chart
      # opens the container port, publishes it on the Service, and can render a
      # ServiceMonitor (see `metrics` further down).
      #
      # `addr` must not be loopback here, and the chart refuses it: inside a pod
      # 127.0.0.1 is out of reach of the Service and of Prometheus. Keep the
      # listener private with a NetworkPolicy instead — it asks for no
      # credentials, exactly like the probes.
      #
      # The exporter emits NATIVE histograms. Prometheus needs
      # `--enable-feature=native-histograms` to negotiate protobuf; without it
      # the scrape does not fail, it silently loses every bucket. See the chart
      # README.
      prometheus: true
      addr: ":9090"
      path: /metrics

      # PUSHED: OTLP to a collector. Set otlp-endpoint and metrics are pushed
      # there every otlp-interval.
      #
      # With `prometheus: false` this is push-only: no listener, no container
      # port, no Service port, no ServiceMonitor. The chart works that out on
      # its own, and `addr` is never read.
      #
      # The endpoint may be a collector Service, or localhost when one runs as
      # a sidecar in this pod — see `sidecars` below. Enabled with neither
      # exporter is refused: it would collect and export nowhere.
      # otlp-endpoint: otel-collector.monitoring.svc:4318
      # otlp-protocol: http          # http or grpc
      # otlp-insecure: false         # plaintext, for an in-cluster collector
      # otlp-interval: 60s
      # shutdown-timeout: 5s
      # service-name: teamster

# Credentials, delivered as TEAMSTER_* environment variables from a Secret.
#
# Point `existingSecret` at a secret you manage — sealed, external-secrets,
# whatever — and the chart creates none. That secret must use these key names:
#
#   TEAMSTER_WEBHOOK_TOKEN
#   TEAMSTER_ADMIN_USERNAME
#   TEAMSTER_ADMIN_PASSWORD
#   TEAMSTER_GRAPH_CLIENT_SECRET
#   TEAMSTER_AUTH_OIDC_CLIENT_SECRET   (optional)
#   TEAMSTER_BOT_CLIENT_SECRET         (optional)
#   TEAMSTER_AUTH_BROKER_TOKEN_ENCRYPTION_KEY   (optional)
credentials:
  existingSecret: ""
  # Shared secret expected in the X-Teamster-Token header.
  webhookToken: ""
  # The local login, used at /admin/login and as basic auth for /api. Keep it
  # configured: it is the way back in if the identity provider is unreachable.
  adminUsername: admin
  adminPassword: ""
  # Microsoft Entra client secret for posting cards.
  graphClientSecret: ""
  # Omit for a public OIDC client using PKCE, which is the recommended setup.
  oidcClientSecret: ""
  # Microsoft Entra client secret for the bot registration. Alerts in a
  # person's chat are off unless this and config.settings.bot are both set.
  botClientSecret: ""
  # 32 random bytes, base64 (`openssl rand -base64 32`), sealing the Keycloak
  # tokens stored for config.settings.auth.broker. Losing it only disables the
  # delegated picker until the next login.
  brokerTokenEncryptionKey: ""
  # Postgres password, delivered as TEAMSTER_DATABASE_POSTGRES_PASSWORD.
  # Mutually exclusive with database.postgres.passwordFrom.
  databasePassword: ""
  # Further TEAMSTER_* variables, added to the same secret.
  extra: {}

# Extra containers in the pod, appended after teamster's own.
#
# This is how an OTLP collector runs beside the service: a sidecar shares the
# pod's network namespace, so config.settings.metrics.otlp-endpoint points at
# localhost and nothing leaves the pod unencrypted. The collector's own config
# is yours to mount — a ConfigMap through `extraObjects` and `volumes`.
sidecars: []
  # - name: otel-collector
  #   image: otel/opentelemetry-collector-contrib:0.140.0
  #   args: ["--config=/etc/otel/config.yaml"]
  #   ports:
  #     - name: otlp-http
  #       containerPort: 4318
  #   volumeMounts:
  #     - name: otel-config
  #       mountPath: /etc/otel

# Extra arguments appended after the `serve` command.
extraArgs: []

# Extra environment variables for the container.
env: []
  # - name: TZ
  #   value: Europe/Berlin

# Extra envFrom sources, e.g. a secret holding TEAMSTER_* overrides.
envFrom: []

# /healthz reports that the process runs, /readyz that it can serve — the store
# answers and no shutdown has begun. Both are unauthenticated.
#
# Liveness must not check the database: restarting the process does not bring
# one back, it only turns an outage into a crash loop.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

# Startup is opening the database and running its migrations, which is quick
# enough that liveness covers it — so there is no startupProbe by default.
#
# The case for one is the first start after an upgrade that rebuilds a table:
# with a large active_alerts, that can outlast the liveness probe's patience,
# and a liveness failure during startup is a restart loop that never finishes
# the migration. Uncomment this then, and give failureThreshold × periodSeconds
# more time than the migration needs.
#
# startupProbe:
#   httpGet:
#     path: /healthz
#     port: http
#   periodSeconds: 5
#   failureThreshold: 30
startupProbe: {}

resources: {}
  # limits:
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 128Mi

# Ingress for the admin UI and the webhook endpoints.
# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: teamster.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: teamster-tls
    #   hosts:
    #     - teamster.local

# Gateway API HTTPRoute, as an alternative to the Ingress above. Requires the
# Gateway API CRDs and a controller (https://gateway-api.sigs.k8s.io/guides/).
#
# Two routes, because the paths behind them trust different things: external's
# authenticate themselves (a shared token, a Teams V2 URL token, or Microsoft's
# own signature on a bot activity), internal's rely on a session or basic auth.
# A cluster that wants the webhooks reachable from the internet and the admin
# interface reachable only through a private listener needs them on separate
# Gateways or hostnames, which one HTTPRoute cannot express.
#
# internal is off by default, and while it is, external alone still reaches
# everything: its rules fold in internal's catch-all, exactly like the single
# all-in-one route this chart used to render. Turning internal on splits the
# two apart. There is no fallback the other way — turning internal on without
# external does not expose the webhooks; that would change what a deployment
# publishes based on a flag named for the opposite purpose.
httpRoute:
  external:
    enabled: false
    annotations: {}
    # Which Gateways this route attaches to.
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway
        sectionName: http
        # namespace: default
    hostnames:
      - teamster.local
    # Every self-authenticating endpoint teamster serves. Narrow this if you
    # want fewer of them reachable here; do not add /admin or /api -- that
    # traffic belongs on httpRoute.internal, not here. /bot/messages is matched
    # unconditionally: the chart has no separate "is the bot configured" flag,
    # and matching a path the app has not registered is harmless -- the app
    # decides what happens, this only decides which route the request arrives
    # through.
    matches:
      - path:
          type: Exact
          value: /webhook/alertmanager
      - path:
          type: Exact
          value: /webhook/universal
      - path:
          type: PathPrefix
          value: /teamsv2
      - path:
          type: Exact
          value: /bot/messages
    filters: []
    timeouts: {}
    # filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       set:
    #         - name: X-Forwarded-Proto
    #           value: https

  internal:
    enabled: false
    annotations: {}
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway
        sectionName: http
        # namespace: default
    hostnames:
      - teamster.local
    matches:
      - path:
          type: PathPrefix
          value: /
    filters: []
    timeouts: {}

# A disruption budget for a multi-replica postgres release. A single-pod release
# gets none: one-of-one blocks every node drain.
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Additional volumes and mounts on the pod.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Image used by `helm test`.
tests:
  image:
    repository: busybox
    tag: "1.38"
    pullSecrets: []

# ---------------------------------------------------------------------------
# extraObjects: deploy arbitrary additional Kubernetes resources alongside the
# chart.
#
# Two accepted forms:
#   * MAP (recommended) — keyed by an arbitrary name. Maps deep-merge across
#     multiple `-f values.yaml` files, so entries from different files combine
#     instead of replacing each other.
#   * LIST — a plain YAML list. Simpler, but Helm REPLACES lists across values
#     files (the last `-f` wins), so cross-file merging is NOT possible.
#
# Each entry may be a plain YAML object OR a (multi-line) string. Both are run
# through `tpl`, so you can embed `{{ ... }}` template expressions while still
# writing plain YAML.
# In object form a template expression has to sit inside a quoted scalar, or the
# values file stops being YAML. Use the string form to template whole blocks.
extraObjects: {}
  # alertmanager-webhook:                  # <- merge key (map form)
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: "{{ include \"teamster.fullname\" . }}-alertmanager"
  #   data:
  #     url: "http://{{ include \"teamster.fullname\" . }}:{{ .Values.service.port }}/webhook/alertmanager"
  # alertmanager-secret: |                 # <- string form
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: {{ include "teamster.fullname" . }}-alertmanager
  #     labels:
  #       {{- include "teamster.labels" . | nindent 8 }}
  #   type: Opaque
  #   stringData:
  #     token: {{ .Values.credentials.webhookToken | quote }}
